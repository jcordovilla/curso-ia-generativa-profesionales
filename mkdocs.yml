site_name: IA Generativa para Profesionales
site_description: "Curso práctico y gratuito de IA generativa para profesionales senior. Ocho módulos progresivos: desde entender la IA y usarla con criterio hasta conectarla a tu correo y tus documentos y montar tu propio sistema, sin ser programador."

theme:
  name: material
  font:
    text: Lato
    code: Fira Code
  language: es
  logo: assets/logo.svg
  favicon: assets/favicon.png
  features:
    - navigation.instant
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

copyright: >
  © José Cordovilla ·
  Contenido bajo licencia <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.es" target="_blank" rel="noopener">CC BY-SA 4.0</a> ·
  ¿Algo no te ha funcionado o falta algo?
  <a href="mailto:jose@cordovilla.email?subject=Curso%20IA%3A%20feedback">Escríbeme</a>

extra_css:
  - style.css

extra_javascript:
  - javascripts/tareas.js
  - javascripts/analitica.js


markdown_extensions:

  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true

  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.tilde

nav:
  - "Bienvenida": index.md
  - "Antes de empezar": antes-de-empezar.md
  - "Módulo 1 - Entender la IA generativa": modulo-1-entender-ia-generativa.md
  - "Módulo 2 - Encadenar y adjuntar antes que automatizar": modulo-2-automatizar-con-ia.md
  - "Módulo 3 - Asistentes con documentos": modulo-3-asistentes-con-documentos.md
  - "Módulo 4 - Tus datos importan más que la IA": modulo-4-tus-datos-importan-mas.md
  - "Módulo 5 - IA que programa por ti": modulo-5-ia-que-programa.md
  - "Módulo 6 - Mirar dentro de un sistema real": modulo-6-construir-sistema.md
  - "Módulo 7 - Evaluar y escalar": modulo-7-evaluar-y-escalar.md
  - "Módulo 8 - Tu caso de uso": modulo-8-caso-uso-final.md
  - "Recursos": recursos.md
  - "Glosario": glosario.md
  - "Novedades": novedades.md


plugins:
  - search
  - callouts
  - git-revision-date-localized:
      type: date
      locale: es
      fallback_to_build_date: true
  # Edición de octubre de 2026: entra el módulo 4 nuevo y los antiguos 4-7 pasan a 5-8.
  # Las direcciones antiguas siguen funcionando y llevan a su módulo.
  - redirects:
      redirect_maps:
        "modulo-4-ia-que-programa.md": "modulo-5-ia-que-programa.md"
        "modulo-5-construir-sistema.md": "modulo-6-construir-sistema.md"
        "modulo-6-evaluar-y-escalar.md": "modulo-7-evaluar-y-escalar.md"
        "modulo-7-caso-uso-final.md": "modulo-8-caso-uso-final.md"

exclude_docs: |
  _archivo/