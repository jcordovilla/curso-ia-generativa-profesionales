<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="920" height="620" role="img" aria-label="Semáforo de replicabilidad en tres niveles: en verde lo que puedes hacer tú sin programar, en ámbar lo que requiere unos días de un especialista y luego operas tú, en rojo lo que exige programación continua y conviene dejar a IT">
  <defs>
    <style>
      .titulo { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 21px; font-weight: 700; fill: #1a202c; }
      .subtitulo { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 14px; fill: #4a5568; }
      .cab-v { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f766e; letter-spacing: 0.5px; }
      .cab-a { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #92400e; letter-spacing: 0.5px; }
      .cab-r { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #991b1b; letter-spacing: 0.5px; }
      .sub-v { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; font-style: italic; fill: #0f766e; }
      .sub-a { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; font-style: italic; fill: #92400e; }
      .sub-r { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; font-style: italic; fill: #991b1b; }
      .item { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #1a202c; }
      .pie { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-style: italic; fill: #4a5568; }
    </style>
  </defs>

  <text class="titulo" x="460" y="40" text-anchor="middle">El semáforo de replicabilidad</text>
  <text class="subtitulo" x="460" y="64" text-anchor="middle">Qué replicar tú, qué encargar y qué dejar estar</text>

  <!-- Columna verde -->
  <rect x="40" y="100" width="273" height="430" rx="10" fill="#ccfbf1" stroke="#5eead4" stroke-width="1.5" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>
  <text class="cab-v" x="176" y="140" text-anchor="middle">HAZLO TÚ</text>
  <text class="sub-v" x="176" y="162" text-anchor="middle">sin programar, hoy</text>
  <line x1="70" y1="180" x2="283" y2="180" stroke="#5eead4" stroke-width="1.5"/>
  <text class="item" x="66" y="212">· Notas y carpetas</text>
  <text class="item" x="78" y="230">con criterio</text>
  <text class="item" x="66" y="262">· Plantillas y listas</text>
  <text class="item" x="78" y="280">de comprobación</text>
  <text class="item" x="66" y="312">· La disciplina de</text>
  <text class="item" x="78" y="330">exigir fuentes</text>
  <text class="item" x="66" y="362">· Asistentes con</text>
  <text class="item" x="78" y="380">documentos (módulo 3)</text>
  <text class="item" x="66" y="412">· Flujos no-code</text>
  <text class="item" x="78" y="430">sencillos (módulo 2)</text>

  <!-- Columna ámbar -->
  <rect x="333" y="100" width="273" height="430" rx="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>
  <text class="cab-a" x="469" y="140" text-anchor="middle">CON AYUDA PUNTUAL</text>
  <text class="sub-a" x="469" y="162" text-anchor="middle">días de un especialista;</text>
  <text class="sub-a" x="469" y="178" text-anchor="middle">después lo operas tú</text>
  <line x1="363" y1="196" x2="576" y2="196" stroke="#fcd34d" stroke-width="1.5"/>
  <text class="item" x="359" y="228">· Búsqueda por significado</text>
  <text class="item" x="371" y="246">sobre tu correo</text>
  <text class="item" x="371" y="264">y tus documentos</text>
  <text class="item" x="359" y="296">· Conectores entre la IA</text>
  <text class="item" x="371" y="314">y tus herramientas</text>
  <text class="item" x="359" y="346">· Tareas programadas</text>
  <text class="item" x="371" y="364">que corren solas</text>

  <!-- Columna roja -->
  <rect x="626" y="100" width="273" height="430" rx="10" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>
  <text class="cab-r" x="762" y="140" text-anchor="middle">NO TE COMPENSA</text>
  <text class="sub-r" x="762" y="162" text-anchor="middle">programación continua;</text>
  <text class="sub-r" x="762" y="178" text-anchor="middle">es un proyecto para IT</text>
  <line x1="656" y1="196" x2="869" y2="196" stroke="#fca5a5" stroke-width="1.5"/>
  <text class="item" x="652" y="228">· Construir conectores</text>
  <text class="item" x="664" y="246">a medida</text>
  <text class="item" x="652" y="278">· Mantener las bases</text>
  <text class="item" x="664" y="296">de datos del índice</text>
  <text class="item" x="652" y="328">· Depurar sincronizaciones</text>
  <text class="item" x="664" y="346">y averías finas</text>

  <text class="pie" x="460" y="576" text-anchor="middle">El semáforo es la frontera honesta: casi todo el valor está en las dos primeras columnas.</text>
</svg>
